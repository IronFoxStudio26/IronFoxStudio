/* IRON FOX STUDIO — immersive Nexus page system */
:root { color-scheme: dark; }
html { min-height:100%; background:#050916; }
body {
  position:relative; isolation:isolate; min-height:100vh; overflow-x:clip;
  color:#edf5ff !important;
  background:
    radial-gradient(ellipse at 50% 18%,rgba(54,104,194,.23),transparent 42%),
    radial-gradient(ellipse at 88% 72%,rgba(125,64,189,.15),transparent 34%),
    linear-gradient(180deg,#050916 0%,#0a1430 48%,#050914 100%) !important;
}
body::before {
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(circle at 12% 21%,rgba(255,255,255,.8) 0 1px,transparent 1.7px),
    radial-gradient(circle at 72% 36%,rgba(140,202,255,.7) 0 1px,transparent 1.8px),
    radial-gradient(circle at 45% 79%,rgba(255,173,112,.7) 0 1px,transparent 1.8px),
    radial-gradient(circle at 86% 12%,rgba(255,255,255,.65) 0 1px,transparent 1.8px);
  background-size:137px 131px,191px 173px,223px 211px,167px 181px;
  opacity:.65; animation:nexusStarDrift 38s linear infinite;
}
body::after {
  content:""; position:fixed; width:min(65vw,760px); aspect-ratio:1; right:-19vw; top:9vh;
  z-index:-1; pointer-events:none; border-radius:50%;
  border:1px solid rgba(91,167,255,.16);
  box-shadow:0 0 90px rgba(48,124,255,.08),inset 0 0 80px rgba(69,132,255,.06);
  background:radial-gradient(circle at 35% 32%,rgba(130,194,255,.10),rgba(27,49,99,.04) 43%,transparent 68%);
  animation:nexusOrbFloat 14s ease-in-out infinite alternate;
}
header {
  position:sticky !important; top:0; z-index:100;
  background:rgba(5,11,27,.72) !important; backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(129,180,255,.22) !important;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}
nav {
  width:min(1280px,100%) !important; max-width:1280px !important; min-height:76px;
  margin:0 auto !important; padding:13px clamp(16px,3vw,36px) !important;
  display:flex !important; justify-content:space-between !important; align-items:center !important; gap:22px;
}
.logo { color:#f5f8ff !important; font-size:clamp(18px,2vw,25px) !important; letter-spacing:.02em; text-shadow:0 0 22px rgba(95,168,255,.25); white-space:nowrap; }
.menu { margin-left:auto !important; display:flex !important; align-items:center; gap:clamp(12px,2vw,28px) !important; }
.menu a {
  color:#c9d9f7 !important; text-decoration:none; font-size:13px; font-weight:800 !important;
  letter-spacing:.13em; text-transform:uppercase; padding:11px 2px; position:relative;
  transition:color .2s ease,text-shadow .2s ease;
}
.menu a::after { content:""; position:absolute; height:2px; left:50%; right:50%; bottom:3px; background:linear-gradient(90deg,#ffab69,#79d9ff); transition:left .25s,right .25s; box-shadow:0 0 12px #75bfff; }
.menu a:hover { color:white !important; text-shadow:0 0 14px rgba(115,196,255,.65); }
.menu a:hover::after { left:0; right:0; }
.profile-box { position:relative; flex-shrink:0; }
#signUpBtn {
  color:#fff !important; border:1px solid rgba(121,190,255,.5) !important;
  border-radius:999px !important; padding:9px 16px !important;
  background:linear-gradient(135deg,rgba(39,77,135,.68),rgba(28,24,67,.8)) !important;
  box-shadow:inset 0 1px rgba(255,255,255,.16),0 0 24px rgba(66,144,255,.12);
}
#signUpBtn:hover { transform:translateY(-1px); box-shadow:0 0 24px rgba(80,166,255,.28); }
.profile-menu { z-index:120; background:rgba(9,18,40,.97) !important; border:1px solid rgba(121,190,255,.35) !important; backdrop-filter:blur(16px); }
.profile-menu a:hover { background:rgba(67,124,211,.28) !important; }
footer { position:relative; color:#8fa6ce !important; border-top:1px solid rgba(129,180,255,.15) !important; background:rgba(3,8,20,.45); }
@keyframes nexusStarDrift { from{transform:translate3d(0,0,0)} to{transform:translate3d(-28px,18px,0)} }
@keyframes nexusOrbFloat { from{transform:translate3d(0,-10px,0) rotate(-7deg)} to{transform:translate3d(-25px,18px,0) rotate(7deg)} }
@media(max-width:760px) {
  nav { flex-wrap:wrap; justify-content:center !important; gap:10px 14px !important; }
  .logo { width:100%; justify-content:center; }
  .menu { margin:0 !important; order:2; width:100%; justify-content:center; gap:clamp(12px,4vw,22px) !important; }
  .menu a { font-size:11px; letter-spacing:.09em; }
  .profile-box { position:absolute; right:12px; top:10px; }
  #signUpBtn { padding:7px 10px !important; font-size:12px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
}


/* GAMES: full-page Nexus realm selector */
.games {
  width:100% !important; max-width:none !important; margin:0 !important;
  padding:clamp(38px,6vw,78px) clamp(16px,4vw,54px) 90px !important;
  position:relative; overflow:hidden;
}
.games::before {
  content:""; position:absolute; width:min(58vw,780px); height:min(58vw,780px);
  top:65px; left:50%; transform:translateX(-50%); border-radius:50%;
  border:1px solid rgba(94,176,255,.18); box-shadow:0 0 90px rgba(48,130,255,.10),inset 0 0 90px rgba(48,130,255,.06);
  pointer-events:none;
}
.games::after {
  content:""; position:absolute; top:145px; left:50%; transform:translateX(-50%) rotate(-16deg);
  width:min(74vw,980px); height:220px; border:1px solid rgba(255,166,105,.16); border-radius:50%;
  box-shadow:0 0 32px rgba(255,166,105,.07); pointer-events:none;
}
.games-container {
  position:relative; z-index:1; width:min(1320px,100%) !important; max-width:1320px !important;
  margin:0 auto !important; padding:clamp(25px,4vw,52px) 0 !important;
  background:transparent !important; border:0 !important; border-radius:0 !important; box-shadow:none !important;
}
.games-container h2 {
  color:#f4f8ff !important; text-align:center; text-transform:uppercase;
  font-size:clamp(30px,5vw,62px) !important; line-height:1.02; letter-spacing:.09em;
  margin:0 auto 15px !important; text-shadow:0 0 34px rgba(105,174,255,.28);
}
.games-container h2::after {
  content:"NEXUS GATEWAY  /  SELECT YOUR REALM"; display:block; margin:18px auto 0;
  color:#8ea9d7; font-size:11px; font-weight:700; letter-spacing:.28em;
}
.games-grid {
  display:grid !important; grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  gap:clamp(16px,2.2vw,30px) !important; align-items:stretch; perspective:1400px;
  margin-top:clamp(36px,5vw,64px);
}
.game-card, .game-card-link {
  position:relative; display:block; width:auto !important; min-width:0;
  color:#f3f7ff !important; text-decoration:none !important;
  border-radius:22px !important; overflow:hidden; isolation:isolate;
  background:linear-gradient(160deg,rgba(28,53,91,.86),rgba(7,14,32,.96)) !important;
  border:1px solid rgba(141,192,255,.35) !important;
  box-shadow:0 28px 55px rgba(0,0,0,.40),inset 0 1px rgba(255,255,255,.14),0 0 0 1px rgba(91,148,255,.05);
  transform:translateY(0) rotateX(0deg); transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.75,.2,1),border-color .3s,box-shadow .35s;
}
.game-card::before {
  content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.19),transparent 23%,transparent 65%,rgba(105,166,255,.12));
  opacity:.7; transition:opacity .3s;
}
.game-card::after {
  content:""; position:absolute; z-index:3; left:12%; right:12%; top:0; height:1px;
  background:linear-gradient(90deg,transparent,#9ad8ff,transparent); box-shadow:0 0 20px #70bdff;
}
.game-card img {
  display:block; width:100% !important; height:clamp(260px,31vw,420px) !important;
  object-fit:cover; transition:transform .65s cubic-bezier(.2,.75,.2,1),filter .45s;
  filter:saturate(.9) contrast(1.04);
}
.game-card h3 {
  position:relative; z-index:4; color:#f7faff !important; text-align:left !important;
  margin:0 !important; padding:22px 22px 8px !important;
  font-size:clamp(18px,2vw,25px); letter-spacing:.015em;
}
.game-card p {
  position:relative; z-index:4; color:#9fb6dd !important; text-align:left !important;
  margin:0 !important; padding:0 22px 25px !important; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
}
.game-card:hover {
  transform:translateY(-12px) rotateX(2deg) scale(1.015) !important;
  border-color:rgba(134,211,255,.82) !important;
  box-shadow:0 40px 80px rgba(0,0,0,.5),0 0 34px rgba(69,157,255,.18),inset 0 1px rgba(255,255,255,.22);
}
.game-card:hover img { transform:scale(1.055); filter:saturate(1.12) contrast(1.07); }
.game-card:hover::before { opacity:1; }
.game-card:active { transform:translateY(-3px) scale(.99) !important; }
@media(max-width:900px) {
  .games-grid { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
  .game-card img { height:320px !important; }
}
@media(max-width:600px) {
  .games { padding:28px 16px 55px !important; }
  .games::before { width:100vw; height:100vw; top:120px; }
  .games::after { width:120vw; top:180px; }
  .games-container { padding:18px 0 !important; }
  .games-container h2 { font-size:31px !important; letter-spacing:.05em; }
  .games-container h2::after { font-size:9px; letter-spacing:.15em; }
  .games-grid { grid-template-columns:1fr !important; gap:22px !important; margin-top:32px; }
  .game-card img { height:auto !important; aspect-ratio:4/3; }
  .game-card h3 { padding:18px 18px 7px !important; }
  .game-card p { padding:0 18px 20px !important; }
}

// Gallery cards are real links; keyboard focus and reduced-motion are supported.
(() => {
  const cards = document.querySelectorAll('.game-card-link');
  if (!cards.length) return;
  cards.forEach((card, index) => {
    card.setAttribute('tabindex', '0');
    card.addEventListener('pointermove', event => {
      if (window.matchMedia('(hover: none), (prefers-reduced-motion: reduce)').matches) return;
      const r = card.getBoundingClientRect();
      const x = (event.clientX - r.left) / r.width - .5;
      const y = (event.clientY - r.top) / r.height - .5;
      card.style.setProperty('--tilt-x', `${(-y * 2.8).toFixed(2)}deg`);
      card.style.setProperty('--tilt-y', `${(x * 3.2).toFixed(2)}deg`);
    });
    card.addEventListener('pointerleave', () => {
      card.style.removeProperty('--tilt-x');
      card.style.removeProperty('--tilt-y');
    });
  });
})();
</script>
