		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">

				<style>
					:root{
					--bg:#0f172a;
					--card:#1e293b;
					--text:#f8fafc;
					--muted:#cbd5e1;
					--accent:#3b82f6;
					}

					*{box-sizing:border-box;margin:0;padding:0}

					body{
    					margin:0;
    					font-family:Segoe UI, sans-serif;
    					color:white;

    					background:
       		 			radial-gradient(circle at top, #2b3560 0%, transparent 45%),
        				linear-gradient(180deg, #121826 0%, #0b111d 100%);
						}


					header{
					position:sticky;
					top:0;
					background:#111827;
					border-bottom:1px solid #334155;
					z-index:100;
					}

					nav{
					max-width:1100px;
					margin:auto;
					display:flex;
					justify-content:space-between;
					align-items:center;
					padding:15px 20px;
					}

					.logo{
					display:flex;
					align-items:center;
					gap:10px;
					text-decoration:none;
					color:white;
					font-weight:bold;
					font-size:28px;
					cursor:pointer;
					}

					.logo:hover{
					opacity:0.9;

					}

					.menu{
					display:flex;
					gap:20px;
					margin-left: 400px;
					}

					.menu a{
					color:var(--text);
					text-decoration:none;
					font-weight:bold;
					}

					.menu a:hover{
					color:var(--accent);
					}

					.hero{
					max-width:1100px;
					margin:auto;
					text-align:center;
					padding:80px 20px;
					}

					.hero h1{
					font-size:48px;
					margin-bottom:20px;
					}

					.hero p{
					color:var(--muted);
					font-size:20px;
					margin-bottom:30px;
					}

					.btn{
					display:inline-block;
					background:var(--accent);
					color:white;
					padding:14px 24px;
					border-radius:10px;
					text-decoration:none;
					font-weight:bold;
					}

					section{
					max-width:1100px;
					margin:auto;
					padding:60px 20px;
					}

					h2{
					margin-bottom:20px;
					font-size:32px;
					}

					.cards{
					display:grid;
					grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
					gap:20px;
					}

					.card{
					background:var(--card);
					border-radius:16px;
					overflow:hidden;
					border:1px solid #334155;
					}

					.card img{
					width:100%;
					height:160px;
					object-fit:cover;
					}

					.card-content{
					padding:20px;
					}

					.card h3{
					margin-bottom:10px;
					}

					.card p{
					color:var(--muted);
					margin-bottom:15px;
					}

					footer{
					text-align:center;
					padding:30px;
					border-top:1px solid #334155;
					color:var(--muted);
					}

					@media(max-width:700px){
					nav{
					flex-direction:column;
					gap:12px;
					}

					.menu{
					flex-wrap:wrap;
					justify-content:center;
					}

					.hero h1{
					font-size:34px;
					}
					}
					.game-image {
					width: 220px;      /* Ширина */
					height: auto;      /* Высота подстроится автоматически */
					border-radius: 10px;
					display: block;
					margin: -2 auto;    /* По центру */
					}
					.games {
					padding: 70px 0;
					}

					/* Белая/тёмная рамка по центру */
					.games-container {
					width: 90%;
					max-width: 1200px;
					margin: 0 auto;
					background: #1d1d1d;
					border-radius: 20px;
					padding: 40px;
					box-shadow: 0 10px 30px rgba(0,0,0,.35);
					}

					.games-container h2 {
					color: white;
					text-align: center;
					margin-bottom: 40px;
					}

					.games-grid {
					display: flex;
					gap: 25px;
					justify-content: center;
					flex-wrap: wrap;
					}

					.game-card {
					width: 260px;
					background: #2a2a2a;
					border-radius: 15px;
					overflow: hidden;
					transition: .3s;
					}

					.game-card:hover {
					transform: translateY(-8px);
					}

					.game-card img {
					width: 100%;
					height: 300px;
					object-fit: cover;
					}

					.game-card h3 {
					color: white;
					text-align: center;
					margin: 15px 0 5px;
					}

					.game-card p {
					color: #ccc;
					text-align: center;
					padding-bottom: 20px;
					}
					.register-box {
						position: absolute;
						top: 20px;
						right: 20px;

						display: flex;
						gap: 10px;
						align-items: center;
						}
						#signUpBtn{
						background: transparent;
						color: white;
						border: 1px solid #6c4cff;
						border-radius: 8px;
						padding: 8px 14px;
						cursor: pointer;

						display: flex;
						align-items: center;
						gap: 8px;

						transition: 0.3s;
						}

						#signUpBtn:hover{
						background: #6c4cff;
						}
						#signUpBtn{
						background:#1f1f35;
						color:white;
						border:1px solid #6c4cff;
						border-radius:8px;
						padding:8px 15px;

						display:flex;
						align-items:center;
						gap:8px;

						cursor:pointer;
						transition:0.3s;
					}

					#signUpBtn:hover{
						background:#6c4cff;
					}

					#signUpBtn img{
						width:32px;
						height:32px;
						border-radius:50%;
					}
					.profile-menu{
					position:absolute;
					top:70px;
					right:20px;

					background:#1f1f35;
					border:1px solid #6c4cff;
					border-radius:10px;

					width:180px;

					display:none;

					overflow:hidden;
					box-shadow:0 10px 25px rgba(0,0,0,.4);
				}

				.profile-menu a{
					display:block;
					padding:12px 15px;
					color:white;
					text-decoration:none;
				}

				.profile-menu a:hover{
					background:#6c4cff;
				}
				.profile-box{
				position:relative;
				display:inline-block;
			}

				#signUpBtn{

					display:flex;
					align-items:center;
					gap:10px;

					background:#20202b;

					color:white;

					border:none;

					border-radius:12px;

					padding:10px 15px;

					cursor:pointer;

					transition:.25s;
				}

				#signUpBtn:hover{

					background:#2e2e42;

				}

				#signUpBtn img{

					width:38px;

					height:38px;

					border-radius:50%;

				}

				.profile-menu{

					display:none;

					position:absolute;

					top:60px;

					right:0;

					width:230px;

					background:#1d1d1d;

					border-radius:15px;

					overflow:hidden;

					box-shadow:0 12px 35px rgba(0,0,0,.45);

				}

				.profile-menu a{

					display:block;

					padding:14px 18px;

					color:white;

					text-decoration:none;

					transition:.25s;

				}

				.profile-menu a:hover{

					background:#6c4cff;

				}

				.profile-menu hr{

					border:none;

					border-top:1px solid #333;

				}
				.show{

				display:block;

			}
		
				@media (max-width: 700px) {
				body {
					overflow-x: hidden;
				}

				/* HEADER */
				nav {
					width: 100%;
					padding: 12px 15px;
					flex-direction: column;
					gap: 12px;
				}

				.logo {
					font-size: 22px;
					text-align: center;
				}

				.menu {
					width: 100%;
					margin-left: 0;
					justify-content: center;
					flex-wrap: wrap;
					gap: 12px 18px;
				}

				.menu a {
					font-size: 15px;
				}

				/* PROFILE */
				.profile-box {
					position: relative;
				}

				#signUpBtn {
					padding: 8px 12px;
					font-size: 14px;
				}

				#signUpBtn img {
					width: 32px;
					height: 32px;
				}

				.profile-menu {
					top: calc(100% + 10px);
					right: 0;
					width: min(230px, calc(100vw - 30px));
				}

				/* GAMES SECTION */
				.games {
					width: 100%;
					padding: 35px 15px;
				}

				.games-container {
					width: 100%;
					max-width: 100%;
					padding: 20px 15px;
					border-radius: 15px;
				}

				.games-container h2 {
					font-size: 28px;
					margin-bottom: 25px;
				}

				/* GAMES GRID */
				.games-grid {
					width: 100%;
					display: flex;
					flex-direction: column;
					align-items: center;
					gap: 20px;
				}

				/* GAME CARD */
				.game-card {
					width: 100%;
					max-width: 320px;
				}

				.game-card img {
					width: 100%;
					height: auto;
					aspect-ratio: 3 / 4;
					object-fit: cover;
				}

				.game-card h3 {
					font-size: 20px;
					margin: 14px 0 6px;
				}

				.game-card p {
					font-size: 15px;
					padding-bottom: 18px;
				}

				/* FOOTER */
				footer {
					padding: 25px 15px;
					font-size: 14px;
				}
				}
				/* ========================= SMALL iPHONE ========================= */
				@media (max-width: 380px) {
				.logo {
					font-size: 20px;
				}

				.menu {
					gap: 10px 14px;
				}

				.menu a {
					font-size: 14px;
				}

				.games {
					padding: 25px 10px;
				}

				.games-container {
					padding: 15px 10px;
				}

				.games-container h2 {
					font-size: 25px;
				}

				.game-card {
					max-width: 290px;
				}

				.game-card h3 {
					font-size: 18px;
				}
				}




				</style>
			</meta>
		</meta>

<style id="ironfox-immersive-3d">

/* Iron Fox Studio — immersive 3D page layer */
:root{
  --nexus-ink:#05091c; --nexus-blue:#124bff; --nexus-cyan:#65e6ff;
  --nexus-violet:#815bff; --nexus-glass:rgba(14,32,91,.54);
}
html{min-height:100%;background:#05091c}
body{
  min-height:100vh; overflow-x:hidden; isolation:isolate; position:relative;
  color:#f5f8ff;
  background:
    radial-gradient(ellipse at 50% 115%,rgba(24,108,255,.72),transparent 55%),
    radial-gradient(ellipse at 82% 30%,rgba(90,47,255,.52),transparent 34%),
    radial-gradient(ellipse at 12% 45%,rgba(22,113,255,.30),transparent 36%),
    linear-gradient(145deg,#030719 0%,#071747 48%,#080d2a 100%) !important;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(circle at 50% 44%,rgba(74,129,255,.22),transparent 18%),
    radial-gradient(circle at 28% 68%,rgba(70,100,255,.16),transparent 20%),
    radial-gradient(circle at 77% 70%,rgba(0,221,255,.12),transparent 18%);
  filter:blur(22px);animation:nexusBreath 12s ease-in-out infinite alternate;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.48;
  background-image:
   radial-gradient(2px 2px at 8% 19%,#d8f6ff 45%,transparent 70%),
   radial-gradient(1.5px 1.5px at 21% 73%,#fff 45%,transparent 70%),
   radial-gradient(2px 2px at 42% 14%,#a7dfff 45%,transparent 70%),
   radial-gradient(1px 1px at 67% 33%,#fff 45%,transparent 70%),
   radial-gradient(2px 2px at 84% 61%,#b6c8ff 45%,transparent 70%),
   radial-gradient(1.5px 1.5px at 92% 16%,#fff 45%,transparent 70%),
   radial-gradient(1px 1px at 59% 84%,#fff 45%,transparent 70%);
  background-size:360px 300px;animation:nexusStars 35s linear infinite;
}
@keyframes nexusBreath{from{transform:scale(1) translate3d(-1%,0,0)}to{transform:scale(1.08) translate3d(1%,-1%,0)}}
@keyframes nexusStars{from{background-position:0 0}to{background-position:360px 300px}}
header{
  background:rgba(4,10,33,.62)!important;backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(137,194,255,.22)!important;
  box-shadow:0 12px 38px rgba(0,0,0,.22);
}
nav{max-width:1240px!important;width:100%;gap:22px}
.logo{letter-spacing:.02em;text-shadow:0 0 22px rgba(80,166,255,.42)}
.menu{margin-left:auto!important;gap:clamp(12px,2vw,28px)!important}
.menu a{position:relative;padding:10px 2px;transition:color .25s,text-shadow .25s}
.menu a::after{content:"";position:absolute;left:50%;right:50%;bottom:2px;height:2px;border-radius:4px;
 background:linear-gradient(90deg,var(--nexus-cyan),var(--nexus-violet));transition:left .28s,right .28s;box-shadow:0 0 12px #55bfff}
.menu a:hover::after,.menu a:focus-visible::after{left:0;right:0}
.menu a:hover{color:#a7f3ff!important;text-shadow:0 0 14px rgba(82,190,255,.6)}
/* Glass panels gain perspective without changing existing destinations */
.games{perspective:1400px;position:relative}
.games-container{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(135deg,rgba(29,67,156,.45),rgba(9,18,59,.72))!important;
  border:1px solid rgba(158,205,255,.34);
  box-shadow:0 35px 90px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.15),0 0 55px rgba(47,105,255,.18)!important;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transform:translateZ(0);
}
.games-container::before{
  content:"";position:absolute;inset:-35% 10% auto;height:300px;border:1px solid rgba(113,213,255,.24);
  border-radius:50%;transform:rotate(-12deg);pointer-events:none;z-index:-1;
  box-shadow:0 0 35px rgba(70,159,255,.10),inset 0 0 35px rgba(70,159,255,.08)
}
.games-container::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.36;
  background:linear-gradient(115deg,transparent 15%,rgba(150,222,255,.10) 48%,transparent 68%);
}
.games-container h2{position:relative;text-shadow:0 0 28px rgba(81,166,255,.48)}
.games-grid{position:relative;z-index:1;perspective:1200px;align-items:stretch}
.game-card{
  position:relative;isolation:isolate;flex:0 1 260px;max-width:100%;
  background:linear-gradient(155deg,rgba(37,79,164,.72),rgba(8,17,54,.94))!important;
  border:1px solid rgba(166,211,255,.42);
  box-shadow:0 18px 32px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.20),0 0 24px rgba(49,120,255,.13);
  transform:translateY(0) rotateX(0deg);transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.75,.2,1),box-shadow .45s,border-color .35s;
  text-decoration:none;color:inherit;
}
.game-card::before{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(130deg,rgba(255,255,255,.16),transparent 26%,transparent 68%,rgba(85,150,255,.12));
  opacity:.7;transition:opacity .3s;
}
.game-card img{display:block;transition:transform .65s cubic-bezier(.2,.7,.2,1),filter .4s;filter:saturate(1.08) contrast(1.03)}
.game-card h3,.game-card p{position:relative;z-index:3}
.game-card h3{text-shadow:0 2px 18px rgba(0,0,0,.35)}
.game-card:hover,.game-card:focus-visible{
  transform:translateY(-12px) rotateX(2deg) scale(1.025);
  border-color:rgba(135,231,255,.88);
  box-shadow:0 32px 54px rgba(0,0,0,.38),0 0 36px rgba(53,153,255,.3),inset 0 1px rgba(255,255,255,.26);
}
.game-card:hover img,.game-card:focus-visible img{transform:scale(1.055);filter:saturate(1.22) contrast(1.06)}
.game-card:hover::before{opacity:1}
.about{position:relative;perspective:1300px}
.about-image{
  position:relative;max-width:min(900px,100%)!important;width: min(78%,900px)!important;
  border:1px solid rgba(159,211,255,.52);border-radius:22px!important;
  box-shadow:0 35px 75px rgba(0,0,0,.4),0 0 45px rgba(60,133,255,.28),inset 0 1px rgba(255,255,255,.2);
  transform:perspective(1200px) rotateX(1deg);transition:transform .6s,box-shadow .6s;
}
.about-image:hover{transform:perspective(1200px) rotateX(0deg) translateY(-5px);box-shadow:0 42px 90px rgba(0,0,0,.44),0 0 60px rgba(60,153,255,.34)}
.about h2{
  max-width:1000px;margin:30px auto 0!important;padding:clamp(22px,4vw,42px);
  font-size:clamp(20px,2.4vw,30px)!important;line-height:1.55;
  background:linear-gradient(135deg,rgba(32,75,165,.46),rgba(10,22,65,.58));
  border:1px solid rgba(151,205,255,.28);border-radius:22px;
  box-shadow:0 24px 65px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.12);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  text-shadow:0 2px 18px rgba(0,0,0,.28);
}
footer{background:rgba(4,10,33,.36);border-top:1px solid rgba(137,194,255,.22)!important}
#signUpBtn{border:1px solid rgba(117,198,255,.5)!important;background:linear-gradient(135deg,rgba(30,83,184,.8),rgba(66,47,155,.8))!important;box-shadow:0 0 20px rgba(61,133,255,.18)}
#signUpBtn:hover{box-shadow:0 0 28px rgba(71,169,255,.42)!important;transform:translateY(-1px)}
.profile-menu{background:rgba(7,16,48,.96)!important;border:1px solid rgba(117,198,255,.42)!important;backdrop-filter:blur(18px)}
@media(max-width:700px){
  nav{gap:10px!important}
  .menu{margin-left:0!important}
  .games{padding:30px 14px!important}
  .games-container{padding:clamp(16px,4vw,24px)!important}
  .games-grid{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:20px!important}
  .game-card{width:100%;max-width:360px;margin-inline:auto;transform:none!important}
  .game-card:hover,.game-card:focus-visible{transform:translateY(-4px)!important}
  .game-card img{height:auto!important;aspect-ratio:3/3.25;object-fit:cover}
  .about{padding:clamp(30px,7vw,48px) 15px!important}
  .about-image{width:100%!important;max-width:100%!important;border-radius:16px!important;transform:none}
  .about h2{padding:22px 18px;font-size:clamp(18px,4.5vw,23px)!important;border-radius:17px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}
}

</style>
</head>
